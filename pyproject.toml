[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundax"
version = "0.2.0"
description = "Unified JAX model zoo for operator learning, KAN variants, and PDE foundation-model wrappers"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Leon Armbruster", email = "leon.armbruster@iisb.fraunhofer.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# License is expressed via the SPDX `license` field above (PEP 639);
# do not duplicate it as a classifier — modern setuptools rejects that.

dependencies = [
    "jax>=0.4",
    "equinox>=0.11",
    "einops",
]

[project.urls]
Homepage = "https://github.com/FhG-IISB/foundax"
Documentation = "https://fhg-iisb.github.io/foundax/"
Source = "https://github.com/FhG-IISB/foundax"
Issues = "https://github.com/FhG-IISB/foundax/issues"

[project.scripts]
foundax-convert = "foundax.cli:convert_entry"
foundax-compare = "foundax.cli:compare_entry"
foundax-verify = "foundax.cli:verify_entry"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
foundax = ["py.typed"]

[tool.setuptools.packages.find]
include = ["foundax*", "jax_bcat*", "jax_dpot*", "jax_morph*", "jax_mpp*", "jax_pdeformer2*", "jax_poseidon*", "jax_prose*", "jax_walrus*"]
where = [".", "repos/jax_bcat", "repos/jax_dpot", "repos/jax_morph", "repos/jax_mpp", "repos/jax_pdeformer2", "repos/jax_poseidon", "repos/jax_prose", "repos/jax_walrus"]

[tool.ruff]
# Exclude vendored upstream code (mirrors pytest `norecursedirs`).
exclude = ["repos", "og_repos", "build", "dist", "site"]

[tool.ruff.lint.per-file-ignores]
# Tests use `pytest.importorskip` before module imports (E402), compact
# single-line def shims for the test matrix (E702/E731), and short loop
# counters `I`, `l` that are clear in context (E741).
"tests/*" = ["E402", "E702", "E731", "E741"]
# KAN code follows upstream KAN conventions (lambdas for basis functions,
# `I` for identity matrices) that conflict with PEP8 style rules.
"foundax/architectures/kan.py" = ["E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["repos", ".venv", "build", "dist"]
markers = [
    "heavy: slow integration tests for large model construction and single-step autodiff",
    "train: tests that require optax and perform actual training steps",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
foundax = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
# Separate Python 3.11 env for MindSpore-based PDEformer2 conversion
# (MindSpore wheels only support cp310 / cp311).
mindspore = { features = ["mindspore"], no-default-feature = true }

[tool.pixi.feature.mindspore.dependencies]
python = "3.11.*"

[tool.pixi.feature.mindspore.pypi-dependencies]
mindspore = ">=2.7"
numpy = "*"
omegaconf = "*"
sympy = "*"
pyyaml = "*"
pandas = "*"
scipy = "*"
matplotlib = "*"
h5py = "*"
networkx = "*"
imageio = "*"
tqdm = "*"

[tool.pixi.tasks]
fmt = "ruff format ."
lint = "ruff check . --fix"
test = "pytest -x --tb=short"
all = "ruff format . && ruff check . --fix && pytest -x --tb=short"
# CI tasks: read-only (no auto-fix) and skip slow tests
ci-fmt = "ruff format --check ."
ci-lint = "ruff check ."
ci-test = "pytest -x --tb=short -m 'not slow'"

[tool.pixi.dependencies]
pytest = ">=9.0.3,<10"
ruff = ">=0.9.0"
pre-commit = ">=4.0"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.0,<10"
pymdown-extensions = ">=10.0"

[tool.pixi.feature.dev.pypi-dependencies]
optax = ">=0.2"
hydra-core = ">=1.3"
torch = ">=2.0"
huggingface_hub = ">=0.20"
flax = ">=0.8"
matplotlib = ">=3.7"
timm = ">=1.0"
transformers = ">=4.30"
rotary-embedding-torch = ">=0.8.9, <0.9"
torchtune = ">=0.6.1, <0.7"
torchao = ">=0.17.0, <0.18"

[tool.pixi.feature.dev.tasks]
test-train = "pytest --tb=short -m train -v"
test-all = "pytest --tb=short -v"
verify = "python scripts/verify.py"
verify-walrus = "python scripts/verify.py 'models=[walrus]'"
verify-poseidon = "python scripts/verify.py 'models=[poseidon]'"
verify-morph = "python scripts/verify.py 'models=[morph]'"
verify-mpp = "python scripts/verify.py 'models=[mpp]'"
verify-bcat = "python scripts/verify.py 'models=[bcat]'"
verify-dpot = "python scripts/verify.py 'models=[dpot]'"
verify-pdeformer2 = "python scripts/verify.py 'models=[pdeformer2]'"
verify-prose = "python scripts/verify.py 'models=[prose]'"
