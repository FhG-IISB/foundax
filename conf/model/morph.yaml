name: morph
github_url: https://github.com/lanl/MORPH
hf_checkpoint:
  repo_id: mahindrautela/MORPH
  filename: models/FM/morph-Ti-FM-max_ar1_ep225.pth
compare_needs_pt_repo: true
compare_extra_args:
  - "--model-size"
  - "Ti"
  - "--morph-root"
