name: poseidon
github_url: https://github.com/camlab-ethz/poseidon
hf_checkpoint:
  repo_id: camlab-ethz/poseidon
  filename: poseidonT.pt
# compare needs scOT from the cloned repo; also needs a valid checkpoint download
compare_needs_pt_repo: true
compare_extra_args:
  - "--model-path"
  - "{checkpoints_dir}/poseidon/poseidonT.pt"
has_compare: true
convert_extra_args:
  - "--model-path"
  - "{checkpoints_dir}/poseidon/poseidonT.pt"
  - "--save"
