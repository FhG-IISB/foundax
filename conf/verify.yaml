defaults:
  - _self_
  - model:
    - walrus
    - poseidon
    - morph
    - mpp
    - bcat
    - dpot
    - pdeformer2
    - prose

# Root for downloaded/cloned artefacts
outdir: ${hydra:runtime.cwd}/verify_output
# Where to clone original PyTorch repos
repos_dir: ${hydra:runtime.cwd}/og_repos

# Pipeline steps to run (subset of: clone download convert compare)
steps:
  - clone
  - download
  - convert
  - compare

# Force re-download / re-convert even if artefacts already exist
force_download: false
force_convert: false

# Walrus-specific: number of processor blocks in the full model
processor_blocks: 40

hydra:
  job:
    chdir: false
  run:
    dir: ${outdir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
